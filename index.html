<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VKRN ULP WONOSOBO</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            padding-bottom: 80px;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
        }

        .header {
            background: white;
            padding: 25px 20px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            margin-bottom: 30px;
            text-align: center;
            border: 3px solid black;
            position: relative;
        }

        .header::before {
            content: '';
            position: absolute;
            top: -6px;
            left: -6px;
            right: -6px;
            bottom: -6px;
            background: linear-gradient(45deg, gold, #ffd700, gold);
            border-radius: 18px;
            z-index: -1;
        }

        .header h1 {
            color: #1e40af;
            font-size: 28px;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
        }

        .search-container {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            border: 3px solid black;
            position: relative;
            animation: slideIn 0.5s ease;
        }

        .search-container::before {
            content: '';
            position: absolute;
            top: -6px;
            left: -6px;
            right: -6px;
            bottom: -6px;
            background: linear-gradient(45deg, gold, #ffd700, gold);
            border-radius: 18px;
            z-index: -1;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .input-group {
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;
            color: #1e40af;
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 14px;
        }

        .input-group input, .input-group textarea {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #3b82f6;
            border-radius: 8px;
            font-size: 16px;
            transition: all 0.3s ease;
        }

        .input-group input:focus, .input-group textarea:focus {
            outline: none;
            border-color: #1e40af;
            box-shadow: 0 0 0 3px rgba(30, 64, 175, 0.1);
        }

        .input-group textarea {
            resize: vertical;
            min-height: 80px;
        }

        .btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #3b82f6, #1e40af);
            color: white;
            border: 2px solid black;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .btn::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.3);
            transform: translate(-50%, -50%);
            transition: width 0.6s, height 0.6s;
        }

        .btn:hover::before {
            width: 300px;
            height: 300px;
        }

        .btn:active {
            transform: scale(0.98);
        }

        .btn-secondary {
            background: linear-gradient(135deg, #10b981, #059669);
            margin-top: 15px;
        }

        .results-container {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            border: 3px solid black;
            position: relative;
            margin-top: 20px;
            animation: slideIn 0.5s ease;
        }

        .results-container::before {
            content: '';
            position: absolute;
            top: -6px;
            left: -6px;
            right: -6px;
            bottom: -6px;
            background: linear-gradient(45deg, gold, #ffd700, gold);
            border-radius: 18px;
            z-index: -1;
        }

        .result-item {
            background: #f0f9ff;
            padding: 15px;
            margin-bottom: 12px;
            border-radius: 8px;
            border: 2px solid #3b82f6;
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .result-item strong {
            color: #1e40af;
            display: block;
            margin-bottom: 5px;
        }

        .result-item span {
            color: #334155;
            word-break: break-word;
        }

        .pdf-viewer {
            margin-top: 20px;
            border: 2px solid black;
            border-radius: 8px;
            overflow: hidden;
        }

        .pdf-viewer canvas {
            width: 100%;
            height: auto;
            display: block;
        }

        .refresh-btn {
            position: fixed;
            bottom: 30px;
            right: 30px;
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, #fbbf24, #f59e0b);
            border: 3px solid black;
            border-radius: 50%;
            color: white;
            font-size: 28px;
            cursor: pointer;
            box-shadow: 0 5px 20px rgba(0,0,0,0.3);
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .refresh-btn:hover {
            transform: scale(1.1) rotate(180deg);
        }

        .refresh-btn:active {
            transform: scale(0.95);
        }

        .hidden {
            display: none !important;
        }

        .footer {
            text-align: center;
            color: white;
            margin-top: 30px;
            padding: 20px;
            font-weight: 600;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .alert {
            padding: 15px;
            margin: 15px 0;
            border-radius: 8px;
            border: 2px solid;
            animation: slideIn 0.5s ease;
        }

        .alert-error {
            background: #fee2e2;
            border-color: #dc2626;
            color: #991b1b;
        }

        .alert-success {
            background: #d1fae5;
            border-color: #10b981;
            color: #065f46;
        }

        .loading {
            text-align: center;
            padding: 20px;
            color: #1e40af;
            font-weight: 600;
        }

        .spinner {
            border: 4px solid #f3f4f6;
            border-top: 4px solid #3b82f6;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @media (max-width: 480px) {
            body {
                padding: 15px;
                padding-bottom: 80px;
            }

            .header h1 {
                font-size: 24px;
            }

            .search-container, .results-container {
                padding: 20px;
            }

            .refresh-btn {
                width: 50px;
                height: 50px;
                font-size: 24px;
                bottom: 20px;
                right: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>VKRN ULP WONOSOBO</h1>
        </div>

        <div id="searchContainer" class="search-container">
            <div class="input-group">
                <label for="searchInput">Masukkan IDPEL untuk pencarian:</label>
                <input type="text" id="searchInput" placeholder="Contoh: 123456789">
            </div>
            <button class="btn" id="searchBtn">Cari</button>
        </div>

        <div id="resultsContainer" class="results-container hidden">
            <div id="resultsContent"></div>
            <button class="btn btn-secondary" id="sendBtn">Kirim</button>
        </div>

        <div id="formContainer" class="search-container hidden">
            <div class="input-group">
                <label for="keteranganInput">Keterangan:</label>
                <textarea id="keteranganInput" placeholder="Masukkan keterangan"></textarea>
            </div>
            <div class="input-group">
                <label for="hpInput">Nomor HP Pelanggan:</label>
                <input type="tel" id="hpInput" placeholder="Contoh: 08123456789">
            </div>
            <div class="input-group">
                <label for="lokasiInput">Lokasi:</label>
                <input type="text" id="lokasiInput" placeholder="Mendapatkan lokasi..." readonly>
            </div>
            <button class="btn" id="updateBtn">Update</button>
            <button class="btn btn-secondary" id="cancelBtn">Batal</button>
        </div>

        <button class="refresh-btn hidden" id="refreshBtn">⟳</button>

        <div class="footer">@TELWBO 2025</div>
    </div>

    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

        let csvData = [];
        let pdfIndex = {};
        let currentSearchResult = null;
        let currentFileName = '';

        const elements = {
            searchContainer: document.getElementById('searchContainer'),
            searchInput: document.getElementById('searchInput'),
            searchBtn: document.getElementById('searchBtn'),
            resultsContainer: document.getElementById('resultsContainer'),
            resultsContent: document.getElementById('resultsContent'),
            sendBtn: document.getElementById('sendBtn'),
            formContainer: document.getElementById('formContainer'),
            keteranganInput: document.getElementById('keteranganInput'),
            hpInput: document.getElementById('hpInput'),
            lokasiInput: document.getElementById('lokasiInput'),
            updateBtn: document.getElementById('updateBtn'),
            cancelBtn: document.getElementById('cancelBtn'),
            refreshBtn: document.getElementById('refreshBtn')
        };

        // Show/hide refresh button based on search container visibility
        function updateRefreshButtonVisibility() {
            if (!elements.searchContainer.classList.contains('hidden')) {
                elements.refreshBtn.classList.remove('hidden');
            } else {
                elements.refreshBtn.classList.add('hidden');
            }
        }

        // Initialize
        async function init() {
            await loadCSVData();
            getLocation();
            updateRefreshButtonVisibility();
        }

        // Load CSV data
        async function loadCSVData() {
            try {
                const files = await window.fs.readdir('data');
                const csvFiles = files.filter(f => f.endsWith('.csv'));
                
                if (csvFiles.length === 0) {
                    showAlert('Tidak ada file CSV di folder data', 'error');
                    return;
                }

                // Load first CSV file
                currentFileName = csvFiles[0];
                const fileContent = await window.fs.readFile(`data/${currentFileName}`, { encoding: 'utf8' });
                
                Papa.parse(fileContent, {
                    header: true,
                    complete: (results) => {
                        csvData = results.data.filter(row => Object.values(row).some(val => val));
                        console.log('CSV loaded:', csvData.length, 'rows');
                    }
                });
            } catch (error) {
                console.error('Error loading CSV:', error);
                showAlert('Error membaca file CSV. Pastikan folder data ada dan berisi file CSV.', 'error');
            }
        }

        // Index PDF files
        async function indexPDFs() {
            elements.refreshBtn.innerHTML = '<div class="spinner" style="width: 30px; height: 30px; border-width: 3px; margin: 0;"></div>';
            pdfIndex = {};

            try {
                const files = await window.fs.readdir('pdf');
                const pdfFiles = files.filter(f => f.toLowerCase().endsWith('.pdf'));
                
                let processed = 0;
                for (const file of pdfFiles) {
                    try {
                        const pdfData = await window.fs.readFile(`pdf/${file}`);
                        const text = await extractTextFromPDF(pdfData);
                        
                        // Extract IDPEL numbers (assuming 10-12 digit numbers)
                        const idpelMatches = text.match(/\b\d{10,12}\b/g);
                        if (idpelMatches) {
                            idpelMatches.forEach(idpel => {
                                if (!pdfIndex[idpel]) {
                                    pdfIndex[idpel] = [];
                                }
                                pdfIndex[idpel].push(file);
                            });
                        }
                        processed++;
                    } catch (error) {
                        console.error(`Error processing ${file}:`, error);
                    }
                }
                
                elements.refreshBtn.innerHTML = '⟳';
                showAlert(`Indexing selesai! ${processed} file PDF diproses.`, 'success');
                console.log('PDF Index:', pdfIndex);
            } catch (error) {
                elements.refreshBtn.innerHTML = '⟳';
                console.error('Error indexing PDFs:', error);
                showAlert('Error saat indexing PDF. Pastikan folder pdf ada.', 'error');
            }
        }

        // Extract text from PDF
        async function extractTextFromPDF(pdfData) {
            try {
                const loadingTask = pdfjsLib.getDocument({ data: pdfData });
                const pdf = await loadingTask.promise;
                let fullText = '';

                for (let i = 1; i <= pdf.numPages; i++) {
                    const page = await pdf.getPage(i);
                    const textContent = await page.getTextContent();
                    const pageText = textContent.items.map(item => item.str).join(' ');
                    fullText += pageText + ' ';
                }

                return fullText;
            } catch (error) {
                console.error('Error extracting PDF text:', error);
                return '';
            }
        }

        // Search function
        async function searchData() {
            const searchTerm = elements.searchInput.value.trim();
            
            if (!searchTerm) {
                showAlert('Masukkan IDPEL untuk pencarian', 'error');
                return;
            }

            elements.resultsContent.innerHTML = '<div class="loading"><div class="spinner"></div>Mencari data...</div>';
            elements.searchContainer.classList.add('hidden');
            elements.resultsContainer.classList.remove('hidden');
            elements.searchBtn.textContent = 'Cari Lagi';
            updateRefreshButtonVisibility();

            // Search in CSV
            const results = csvData.filter(row => {
                return Object.values(row).some(val => 
                    String(val).toLowerCase().includes(searchTerm.toLowerCase())
                );
            });

            if (results.length === 0) {
                elements.resultsContent.innerHTML = '<div class="alert alert-error">Data tidak ditemukan</div>';
                return;
            }

            currentSearchResult = results[0];
            
            // Display results
            let html = '<h3 style="color: #1e40af; margin-bottom: 15px;">Hasil Pencarian:</h3>';
            
            for (const [key, value] of Object.entries(currentSearchResult)) {
                if (value) {
                    html += `<div class="result-item"><strong>${key}:</strong> <span>${value}</span></div>`;
                }
            }

            // Search for PDF
            const idpel = currentSearchResult.IDPEL || currentSearchResult.idpel || searchTerm;
            if (pdfIndex[idpel] && pdfIndex[idpel].length > 0) {
                html += '<h3 style="color: #1e40af; margin: 20px 0 15px 0;">Dokumen PDF:</h3>';
                
                try {
                    const pdfFile = pdfIndex[idpel][0];
                    const pdfData = await window.fs.readFile(`pdf/${pdfFile}`);
                    html += `<div class="pdf-viewer" id="pdfViewer"></div>`;
                    elements.resultsContent.innerHTML = html;
                    
                    // Render PDF
                    await renderPDF(pdfData);
                } catch (error) {
                    console.error('Error loading PDF:', error);
                    html += '<div class="alert alert-error">Error memuat file PDF</div>';
                    elements.resultsContent.innerHTML = html;
                }
            } else {
                html += '<div class="alert alert-error" style="margin-top: 15px;">Dokumen PDF tidak ditemukan</div>';
                elements.resultsContent.innerHTML = html;
            }
        }

        // Render PDF
        async function renderPDF(pdfData) {
            try {
                const loadingTask = pdfjsLib.getDocument({ data: pdfData });
                const pdf = await loadingTask.promise;
                const page = await pdf.getPage(1);
                
                const viewport = page.getViewport({ scale: 1.5 });
                const canvas = document.createElement('canvas');
                const context = canvas.getContext('2d');
                
                canvas.height = viewport.height;
                canvas.width = viewport.width;
                
                await page.render({
                    canvasContext: context,
                    viewport: viewport
                }).promise;
                
                document.getElementById('pdfViewer').appendChild(canvas);
            } catch (error) {
                console.error('Error rendering PDF:', error);
            }
        }

        // Get location
        function getLocation() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        const lat = position.coords.latitude;
                        const lon = position.coords.longitude;
                        elements.lokasiInput.value = `${lat}, ${lon}`;
                    },
                    (error) => {
                        elements.lokasiInput.value = 'Lokasi tidak tersedia';
                        console.error('Error getting location:', error);
                    }
                );
            } else {
                elements.lokasiInput.value = 'Geolocation tidak didukung';
            }
        }

        // Save data
        async function saveData() {
            if (!currentSearchResult) return;

            const keterangan = elements.keteranganInput.value.trim();
            const hp = elements.hpInput.value.trim();
            const lokasi = elements.lokasiInput.value.trim();

            if (!keterangan || !hp || !lokasi || lokasi === 'Lokasi tidak tersedia') {
                showAlert('Semua field harus diisi dan lokasi harus tersedia', 'error');
                return;
            }

            try {
                // Update current result
                currentSearchResult.KETERANGAN = keterangan;
                currentSearchResult.NOMOR_HP = hp;
                currentSearchResult.LOKASI = lokasi;

                // Find and update in csvData
                const index = csvData.findIndex(row => 
                    JSON.stringify(row) === JSON.stringify(currentSearchResult)
                );
                
                if (index !== -1) {
                    csvData[index] = currentSearchResult;
                }

                // Convert back to CSV
                const csv = Papa.unparse(csvData);
                await window.fs.writeFile(`data/${currentFileName}`, csv);

                showAlert('Data berhasil disimpan!', 'success');
                
                setTimeout(() => {
                    elements.formContainer.classList.add('hidden');
                    elements.resultsContainer.classList.remove('hidden');
                    elements.keteranganInput.value = '';
                    elements.hpInput.value = '';
                }, 2000);
            } catch (error) {
                console.error('Error saving data:', error);
                showAlert('Gagal menyimpan data', 'error');
            }
        }

        // Show alert
        function showAlert(message, type) {
            const alertDiv = document.createElement('div');
            alertDiv.className = `alert alert-${type}`;
            alertDiv.textContent = message;
            
            const container = elements.resultsContainer.classList.contains('hidden') 
                ? elements.searchContainer 
                : elements.resultsContainer;
            
            container.insertBefore(alertDiv, container.firstChild);
            
            setTimeout(() => alertDiv.remove(), 5000);
        }

        // Event listeners
        elements.searchBtn.addEventListener('click', () => {
            if (elements.searchBtn.textContent === 'Cari Lagi') {
                elements.resultsContainer.classList.add('hidden');
                elements.searchContainer.classList.remove('hidden');
                elements.searchBtn.textContent = 'Cari';
                elements.searchInput.value = '';
                currentSearchResult = null;
                updateRefreshButtonVisibility();
            } else {
                searchData();
            }
        });

        elements.searchInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && elements.searchBtn.textContent === 'Cari') {
                searchData();
            }
        });

        elements.sendBtn.addEventListener('click', () => {
            if (!currentSearchResult) return;
            
            elements.resultsContainer.classList.add('hidden');
            elements.formContainer.classList.remove('hidden');
            
            // Pre-fill if data exists
            elements.keteranganInput.value = currentSearchResult.KETERANGAN || '';
            elements.hpInput.value = currentSearchResult.NOMOR_HP || '';
            elements.lokasiInput.value = currentSearchResult.LOKASI || elements.lokasiInput.value;
        });

        elements.updateBtn.addEventListener('click', saveData);

        elements.cancelBtn.addEventListener('click', () => {
            elements.formContainer.classList.add('hidden');
            elements.resultsContainer.classList.remove('hidden');
            elements.keteranganInput.value = '';
            elements.hpInput.value = '';
        });

        elements.refreshBtn.addEventListener('click', indexPDFs);

        // Initialize
        init();
    </script>
</body>
    </html>

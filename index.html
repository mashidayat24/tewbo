<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VKRN ULP WONOSOBO</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #e3f2fd 0%, #bbdefb 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
            overflow: hidden;
            border: 3px solid black;
            position: relative;
        }

        .container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 100%;
            border: 2px solid #FFD700;
            border-radius: 18px;
            pointer-events: none;
            margin: 3px;
        }

        .header {
            background: linear-gradient(135deg, #1976d2 0%, #2196f3 100%);
            padding: 30px 20px;
            text-align: center;
            border-bottom: 3px solid black;
            position: relative;
        }

        .header::after {
            content: '';
            position: absolute;
            bottom: -3px;
            left: 0;
            right: 0;
            height: 2px;
            background: #FFD700;
        }

        h1 {
            color: white;
            font-size: 24px;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
            letter-spacing: 2px;
        }

        .refresh-btn {
            position: absolute;
            right: 20px;
            top: 50%;
            transform: translateY(-50%);
            background: white;
            border: 2px solid black;
            border-radius: 50%;
            width: 45px;
            height: 45px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 3px 10px rgba(0,0,0,0.2);
        }

        .refresh-btn:hover {
            transform: translateY(-50%) rotate(180deg);
            background: #FFD700;
        }

        .refresh-btn:active {
            transform: translateY(-50%) rotate(180deg) scale(0.9);
        }

        .refresh-icon {
            font-size: 24px;
            color: #1976d2;
        }

        .refresh-btn.loading .refresh-icon {
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .indexing-info {
            background: #e3f2fd;
            padding: 15px;
            border-radius: 10px;
            border: 2px solid black;
            margin-bottom: 20px;
            text-align: center;
            position: relative;
        }

        .indexing-info::before {
            content: '';
            position: absolute;
            top: 2px;
            left: 2px;
            right: 2px;
            bottom: 2px;
            border: 1px solid #FFD700;
            border-radius: 8px;
            pointer-events: none;
        }

        .indexing-status {
            font-weight: 600;
            color: #1976d2;
        }

        .indexing-detail {
            font-size: 12px;
            color: #666;
            margin-top: 5px;
        }

        .content {
            padding: 30px 20px;
        }

        .search-box {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 10px;
            color: #1976d2;
            font-weight: 600;
            font-size: 16px;
        }

        input[type="text"], input[type="tel"], textarea {
            width: 100%;
            padding: 15px;
            border: 2px solid black;
            border-radius: 10px;
            font-size: 16px;
            outline: none;
            transition: all 0.3s;
            position: relative;
        }

        input[type="text"]:focus, input[type="tel"]:focus, textarea:focus {
            border-color: #1976d2;
            box-shadow: 0 0 0 3px rgba(25, 118, 210, 0.1), inset 0 0 0 1px #FFD700;
        }

        textarea {
            resize: vertical;
            min-height: 80px;
        }

        .btn {
            width: 100%;
            padding: 15px;
            border: 2px solid black;
            border-radius: 10px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            position: relative;
            overflow: hidden;
        }

        .btn::before {
            content: '';
            position: absolute;
            top: 2px;
            left: 2px;
            right: 2px;
            bottom: 2px;
            border: 1px solid #FFD700;
            border-radius: 8px;
            pointer-events: none;
        }

        .btn-primary {
            background: linear-gradient(135deg, #2196f3 0%, #1976d2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(33, 150, 243, 0.4);
        }

        .btn-primary:active {
            transform: translateY(0);
        }

        .btn-secondary {
            background: linear-gradient(135deg, #FFD700 0%, #FFC107 100%);
            color: black;
            margin-top: 15px;
        }

        .btn-secondary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(255, 215, 0, 0.4);
        }

        .btn-success {
            background: linear-gradient(135deg, #4caf50 0%, #388e3c 100%);
            color: white;
            margin-top: 20px;
        }

        .btn-success:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(76, 175, 80, 0.4);
        }

        .results {
            margin-top: 20px;
            animation: fadeIn 0.5s;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .table-container {
            border: 2px solid black;
            border-radius: 10px;
            margin-bottom: 20px;
            position: relative;
            background: white;
        }

        .table-container::before {
            content: '';
            position: absolute;
            top: 2px;
            left: 2px;
            right: 2px;
            bottom: 2px;
            border: 1px solid #FFD700;
            border-radius: 8px;
            pointer-events: none;
            z-index: 1;
        }

        .table-vertical {
            width: 100%;
            padding: 15px;
        }

        .table-row {
            display: flex;
            justify-content: space-between;
            padding: 12px 0;
            border-bottom: 1px solid #e0e0e0;
        }

        .table-row:last-child {
            border-bottom: none;
        }

        .table-label {
            font-weight: 600;
            color: #1976d2;
            min-width: 80px;
        }

        .table-value {
            flex: 1;
            text-align: right;
            color: #333;
        }

        .pdf-viewer {
            margin-top: 20px;
            border: 2px solid black;
            border-radius: 10px;
            padding: 20px;
            background: #f5f5f5;
            text-align: center;
            position: relative;
        }

        .pdf-viewer::before {
            content: '';
            position: absolute;
            top: 2px;
            left: 2px;
            right: 2px;
            bottom: 2px;
            border: 1px solid #FFD700;
            border-radius: 8px;
            pointer-events: none;
        }

        .pdf-icon {
            font-size: 48px;
            color: #d32f2f;
            margin-bottom: 10px;
        }

        .alert {
            padding: 15px;
            border-radius: 10px;
            border: 2px solid black;
            margin-top: 20px;
            position: relative;
            animation: shake 0.5s;
        }

        .alert::before {
            content: '';
            position: absolute;
            top: 2px;
            left: 2px;
            right: 2px;
            bottom: 2px;
            border: 1px solid #FFD700;
            border-radius: 8px;
            pointer-events: none;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }

        .alert-warning {
            background: #fff3cd;
            color: #856404;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .popup {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0);
            background: white;
            padding: 30px;
            border-radius: 15px;
            border: 3px solid black;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
            z-index: 1000;
            text-align: center;
            min-width: 280px;
            transition: transform 0.3s;
        }

        .popup::before {
            content: '';
            position: absolute;
            top: 3px;
            left: 3px;
            right: 3px;
            bottom: 3px;
            border: 2px solid #FFD700;
            border-radius: 12px;
            pointer-events: none;
        }

        .popup.show {
            transform: translate(-50%, -50%) scale(1);
        }

        .popup-success {
            color: #4caf50;
            font-size: 48px;
            margin-bottom: 15px;
        }

        .popup-error {
            color: #f44336;
            font-size: 48px;
            margin-bottom: 15px;
        }

        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.5);
            display: none;
            z-index: 999;
        }

        .overlay.show {
            display: block;
        }

        .hidden {
            display: none;
        }

        .location-info {
            font-size: 12px;
            color: #666;
            margin-top: 5px;
            font-style: italic;
        }

        @media (max-width: 480px) {
            .content {
                padding: 20px 15px;
            }

            h1 {
                font-size: 20px;
            }

            th, td {
                padding: 8px 5px;
                font-size: 12px;
            }

            .btn {
                padding: 12px;
                font-size: 16px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>VKRN ULP WONOSOBO</h1>
            <button class="refresh-btn" onclick="indexData()" title="Refresh & Indexing Data">
                <div class="refresh-icon">↻</div>
            </button>
        </div>
        
        <div class="content">
            <div id="indexingInfo" class="indexing-info hidden">
                <div class="indexing-status">⏳ Indexing data...</div>
                <div class="indexing-detail">Mohon tunggu, sedang memuat data dari folder...</div>
            </div>

            <div id="searchSection">
                <div class="search-box">
                    <label for="searchInput">Cari Data (IDPEL / Nama / Alamat)</label>
                    <input type="text" id="searchInput" placeholder="Masukkan kata kunci pencarian...">
                </div>
                <button class="btn btn-primary" onclick="searchData()">Cari</button>
            </div>

            <div id="resultsSection" class="hidden">
                <div class="results">
                    <div class="table-container">
                        <div class="table-vertical" id="tableBody"></div>
                    </div>

                    <button class="btn btn-secondary" onclick="showForm()">Kirim</button>
                </div>
                <button class="btn btn-primary" onclick="resetSearch()">Cari Lagi</button>
                
                <div id="pdfSection"></div>
                <div id="alertSection"></div>
            </div>

            <div id="formSection" class="hidden">
                <div class="form-group">
                    <label for="keterangan">Keterangan</label>
                    <textarea id="keterangan" placeholder="Masukkan keterangan..."></textarea>
                </div>
                <div class="form-group">
                    <label for="nomorHP">Nomor HP Pelanggan</label>
                    <input type="tel" id="nomorHP" placeholder="Contoh: 08123456789">
                </div>
                <div class="form-group">
                    <label for="lokasi">Lokasi</label>
                    <input type="text" id="lokasi" placeholder="Mendapatkan lokasi..." readonly>
                    <div class="location-info" id="locationInfo">Klik tombol Update untuk mendapatkan lokasi otomatis</div>
                </div>
                <button class="btn btn-success" onclick="updateData()">Update</button>
                <button class="btn btn-primary" onclick="backToResults()">Kembali</button>
            </div>
        </div>
    </div>

    <div class="overlay" id="overlay"></div>
    <div class="popup" id="popup">
        <div id="popupIcon"></div>
        <div id="popupMessage"></div>
    </div>

    <script>
        // Data demo (simulasi database)
        let demoData = [
            { idpel: '123456789012', nama: 'Budi Santoso', alamat: 'Jl. Merdeka No. 10', tarif: 'R1/900VA', keterangan: '', nomorHP: '', lokasi: '' },
            { idpel: '234567890123', nama: 'Siti Aminah', alamat: 'Jl. Sudirman No. 25', tarif: 'R1/1300VA', keterangan: '', nomorHP: '', lokasi: '' },
            { idpel: '345678901234', nama: 'Ahmad Rizki', alamat: 'Jl. Gatot Subroto No. 5', tarif: 'R1/2200VA', keterangan: '', nomorHP: '', lokasi: '' },
            { idpel: '456789012345', nama: 'Dewi Lestari', alamat: 'Jl. Diponegoro No. 15', tarif: 'R1/900VA', keterangan: '', nomorHP: '', lokasi: '' },
            { idpel: '567890123456', nama: 'Eko Prasetyo', alamat: 'Jl. Ahmad Yani No. 30', tarif: 'R2/3500VA', keterangan: '', nomorHP: '', lokasi: '' }
        ];

        // Data PDF yang tersedia (simulasi)
        const availablePDFs = ['123456789012', '234567890123', '456789012345'];

        let currentSearchResult = null;
        let isIndexed = false;

        // Auto indexing saat pertama kali buka website
        window.addEventListener('load', function() {
            if (!isIndexed) {
                indexData();
            }
        });

        function indexData() {
            const refreshBtn = document.querySelector('.refresh-btn');
            const indexingInfo = document.getElementById('indexingInfo');
            const searchSection = document.getElementById('searchSection');
            
            // Tampilkan loading
            refreshBtn.classList.add('loading');
            indexingInfo.classList.remove('hidden');
            searchSection.classList.add('hidden');
            
            // Simulasi proses indexing (2 detik)
            setTimeout(() => {
                // Simulasi load data dari folder
                console.log('Indexing data dari folder data/...');
                console.log('Total data terindex:', demoData.length);
                console.log('Total PDF terindex:', availablePDFs.length);
                
                isIndexed = true;
                
                // Update UI
                indexingInfo.innerHTML = `
                    <div class="indexing-status">✓ Indexing selesai!</div>
                    <div class="indexing-detail">
                        ${demoData.length} data pelanggan dan ${availablePDFs.length} file PDF berhasil dimuat
                    </div>
                `;
                
                refreshBtn.classList.remove('loading');
                
                // Kembali ke pencarian setelah 1.5 detik
                setTimeout(() => {
                    indexingInfo.classList.add('hidden');
                    searchSection.classList.remove('hidden');
                }, 1500);
                
                showPopup('success', 'Data berhasil diindex!');
            }, 2000);
        }

        function searchData() {
            const query = document.getElementById('searchInput').value.trim().toLowerCase();
            
            if (!isIndexed) {
                showPopup('error', 'Data belum diindex! Klik tombol refresh untuk indexing data.');
                return;
            }
            
            if (!query) {
                showPopup('error', 'Mohon masukkan kata kunci pencarian!');
                return;
            }

            // Cari data
            const results = demoData.filter(item => 
                item.idpel.toLowerCase().includes(query) ||
                item.nama.toLowerCase().includes(query) ||
                item.alamat.toLowerCase().includes(query)
            );

            if (results.length === 0) {
                showPopup('error', 'Data tidak ditemukan!');
                return;
            }

            // Simpan hasil pencarian
            currentSearchResult = results[0];

            // Tampilkan hasil
            displayResults(results);

            // Sembunyikan search section, tampilkan results section
            document.getElementById('searchSection').classList.add('hidden');
            document.getElementById('resultsSection').classList.remove('hidden');
        }

        function displayResults(results) {
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = '';

            const item = results[0];
            tbody.innerHTML = `
                <div class="table-row">
                    <div class="table-label">IDPEL:</div>
                    <div class="table-value">${item.idpel}</div>
                </div>
                <div class="table-row">
                    <div class="table-label">Nama:</div>
                    <div class="table-value">${item.nama}</div>
                </div>
                <div class="table-row">
                    <div class="table-label">Alamat:</div>
                    <div class="table-value">${item.alamat}</div>
                </div>
                <div class="table-row">
                    <div class="table-label">Tarif:</div>
                    <div class="table-value">${item.tarif}</div>
                </div>
            `;

            // Cek ketersediaan PDF
            const pdfSection = document.getElementById('pdfSection');
            const alertSection = document.getElementById('alertSection');
            
            pdfSection.innerHTML = '';
            alertSection.innerHTML = '';

            if (availablePDFs.includes(results[0].idpel)) {
                pdfSection.innerHTML = `
                    <div class="pdf-viewer">
                        <div class="pdf-icon">📄</div>
                        <strong>File PDF Ditemukan</strong>
                        <p>IDPEL: ${results[0].idpel}</p>
                        <p style="font-size: 12px; color: #666; margin-top: 10px;">
                            (Dalam implementasi penuh, PDF akan ditampilkan di sini)
                        </p>
                    </div>
                `;
            } else {
                alertSection.innerHTML = `
                    <div class="alert alert-warning">
                        <strong>⚠️ Peringatan</strong><br>
                        File PDF tidak ditemukan untuk IDPEL: ${results[0].idpel}
                    </div>
                `;
            }
        }

        function resetSearch() {
            document.getElementById('searchInput').value = '';
            document.getElementById('searchSection').classList.remove('hidden');
            document.getElementById('resultsSection').classList.add('hidden');
            document.getElementById('formSection').classList.add('hidden');
            currentSearchResult = null;
        }

        function showForm() {
            document.getElementById('resultsSection').classList.add('hidden');
            document.getElementById('formSection').classList.remove('hidden');

            // Pre-fill data jika sudah ada
            if (currentSearchResult) {
                document.getElementById('keterangan').value = currentSearchResult.keterangan || '';
                document.getElementById('nomorHP').value = currentSearchResult.nomorHP || '';
                document.getElementById('lokasi').value = currentSearchResult.lokasi || '';
            }
        }

        function backToResults() {
            document.getElementById('formSection').classList.add('hidden');
            document.getElementById('resultsSection').classList.remove('hidden');
        }

        function updateData() {
            const keterangan = document.getElementById('keterangan').value.trim();
            const nomorHP = document.getElementById('nomorHP').value.trim();

            if (!keterangan || !nomorHP) {
                showPopup('error', 'Mohon lengkapi semua data!');
                return;
            }

            // Validasi nomor HP
            if (!/^(08|62)\d{8,12}$/.test(nomorHP)) {
                showPopup('error', 'Format nomor HP tidak valid!');
                return;
            }

            // Dapatkan lokasi
            if (navigator.geolocation) {
                document.getElementById('locationInfo').textContent = 'Mendapatkan lokasi...';
                
                navigator.geolocation.getCurrentPosition(
                    function(position) {
                        const lat = position.coords.latitude;
                        const lon = position.coords.longitude;
                        const lokasi = `${lat}, ${lon}`;
                        
                        document.getElementById('lokasi').value = lokasi;
                        
                        // Update data
                        saveData(keterangan, nomorHP, lokasi);
                    },
                    function(error) {
                        document.getElementById('locationInfo').textContent = 'Tidak dapat mendapatkan lokasi. Menggunakan lokasi default.';
                        const lokasi = 'Lokasi tidak tersedia';
                        document.getElementById('lokasi').value = lokasi;
                        saveData(keterangan, nomorHP, lokasi);
                    }
                );
            } else {
                const lokasi = 'Geolocation tidak didukung';
                document.getElementById('lokasi').value = lokasi;
                saveData(keterangan, nomorHP, lokasi);
            }
        }

        function saveData(keterangan, nomorHP, lokasi) {
            // Update data di array (simulasi penyimpanan)
            if (currentSearchResult) {
                const index = demoData.findIndex(item => item.idpel === currentSearchResult.idpel);
                if (index !== -1) {
                    demoData[index].keterangan = keterangan;
                    demoData[index].nomorHP = nomorHP;
                    demoData[index].lokasi = lokasi;
                    
                    // Simulasi penyimpanan ke CSV tanpa download
                    const csvData = convertToCSV(demoData);
                    console.log('Data disimpan ke memori (simulasi CSV):');
                    console.log(csvData);
                    console.log('Data yang diupdate: IDPEL', currentSearchResult.idpel);
                    
                    showPopup('success', 'Data berhasil disimpan!');
                    
                    setTimeout(() => {
                        resetSearch();
                    }, 2000);
                } else {
                    showPopup('error', 'Gagal menyimpan data!');
                }
            }
        }

        function convertToCSV(data) {
            const headers = ['IDPEL', 'Nama', 'Alamat', 'Tarif', 'Keterangan', 'Nomor HP', 'Lokasi'];
            const rows = data.map(item => [
                item.idpel,
                item.nama,
                item.alamat,
                item.tarif,
                item.keterangan,
                item.nomorHP,
                item.lokasi
            ]);
            
            const csvContent = [
                headers.join(','),
                ...rows.map(row => row.map(cell => `"${cell}"`).join(','))
            ].join('\n');
            
            return csvContent;
        }

        function showPopup(type, message) {
            const popup = document.getElementById('popup');
            const overlay = document.getElementById('overlay');
            const icon = document.getElementById('popupIcon');
            const msg = document.getElementById('popupMessage');

            if (type === 'success') {
                icon.innerHTML = '<div class="popup-success">✓</div>';
                msg.innerHTML = `<strong style="color: #4caf50;">Berhasil!</strong><br>${message}`;
            } else {
                icon.innerHTML = '<div class="popup-error">✕</div>';
                msg.innerHTML = `<strong style="color: #f44336;">Gagal!</strong><br>${message}`;
            }

            overlay.classList.add('show');
            popup.classList.add('show');

            setTimeout(() => {
                overlay.classList.remove('show');
                popup.classList.remove('show');
            }, 2500);
        }

        // Enter key untuk search
        document.getElementById('searchInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                searchData();
            }
        });
    </script>
</body>
    </html>

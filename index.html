<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vkrn Sanxing</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: justify-content;
            justify-content: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 600px;
            transition: all 0.3s ease;
        }

        .search-page {
            text-align: center;
        }

        .logo {
            font-size: 2.5em;
            color: white;
            margin-bottom: 20px;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }

        .cache-indicator {
            position: fixed;
            top: 10px;
            right: 10px;
            background: #10b981;
            color: white;
            padding: 8px 15px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            animation: fadeIn 0.3s ease;
            z-index: 1000;
        }

        .floating-wa-btn {
            position: fixed;
            bottom: 30px;
            right: 30px;
            width: 60px;
            height: 60px;
            background: #25D366;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 15px rgba(37, 211, 102, 0.4);
            cursor: pointer;
            transition: all 0.3s ease;
            z-index: 999;
            border: none;
        }

        .floating-wa-btn:hover {
            transform: scale(1.1);
            box-shadow: 0 6px 20px rgba(37, 211, 102, 0.6);
        }

        .floating-wa-btn svg {
            width: 35px;
            height: 35px;
            fill: white;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .search-box {
            background: white;
            border-radius: 50px;
            padding: 10px 20px;
            display: flex;
            align-items: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            transition: all 0.3s ease;
        }

        .search-box:hover {
            box-shadow: 0 15px 40px rgba(0,0,0,0.3);
            transform: translateY(-2px);
        }

        .search-box input {
            flex: 1;
            border: none;
            outline: none;
            font-size: 16px;
            padding: 15px;
            background: transparent;
        }

        .search-box button {
            background: #2563eb;
            border: none;
            color: white;
            padding: 12px 30px;
            border-radius: 30px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .search-box button:hover {
            background: #1d4ed8;
            transform: scale(1.05);
        }

        .results-page {
            display: none;
        }

        .results-container {
            background: white;
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            height: 80vh;
            overflow-y: auto;
            margin-bottom: 15px;
        }

        .result-item {
            background: white;
            border: 2px solid #e2e8f0;
            border-radius: 15px;
            padding: 0;
            margin-bottom: 15px;
            overflow: hidden;
            transition: all 0.3s ease;
        }

        .result-item:hover {
            border-color: #2563eb;
            box-shadow: 0 5px 15px rgba(37,99,235,0.2);
            transform: translateX(5px);
        }

        .result-table {
            width: 100%;
            border-collapse: collapse;
        }

        .result-row {
            display: grid;
            grid-template-columns: 55% 45%;
            border-bottom: 1px solid #e2e8f0;
        }

        .result-row:last-child {
            border-bottom: none;
        }

        .result-label {
            font-weight: 600;
            color: #1e293b;
            background: #f8fafc;
            padding: 12px 15px;
            border-right: 2px solid #e2e8f0;
        }

        .result-value {
            color: #475569;
            padding: 12px 15px;
            word-wrap: break-word;
        }

        .button-group {
            display: flex;
            gap: 10px;
            justify-content: center;
        }

        .btn {
            flex: 1;
            padding: 15px 30px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            max-width: 200px;
        }

        .btn-back {
            background: #1e293b;
            color: white;
        }

        .btn-back:hover {
            background: #0f172a;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }

        .btn-pdf {
            background: #2563eb;
            color: white;
        }

        .btn-pdf:hover {
            background: #1d4ed8;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(37,99,235,0.3);
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #64748b;
        }

        .no-results {
            text-align: center;
            padding: 40px;
            color: #64748b;
            font-size: 18px;
        }

        @media (max-width: 768px) {
            .logo {
                font-size: 2em;
            }

            .result-row {
                grid-template-columns: 55% 45%;
                font-size: 12px;
            }

            .results-container {
                padding: 15px;
            }

            .btn {
                padding: 12px 20px;
                font-size: 14px;
            }
        }

        @media (max-width: 480px) {
            .logo {
                font-size: 1.5em;
            }

            .search-box input {
                font-size: 14px;
                padding: 10px;
            }

            .search-box button {
                padding: 10px 20px;
                font-size: 14px;
            }

            .result-row {
                grid-template-columns: 55% 45%;
                font-size: 13px;
            }

            .result-label, .result-value {
                padding: 10px 12px;
            }

            .btn {
                padding: 12px 15px;
                font-size: 13px;
            }

            .floating-wa-btn {
                width: 50px;
                height: 50px;
                bottom: 20px;
                right: 20px;
            }

            .floating-wa-btn svg {
                width: 28px;
                height: 28px;
            }
        }

        /* Custom Scrollbar */
        .results-container::-webkit-scrollbar {
            width: 8px;
        }

        .results-container::-webkit-scrollbar-track {
            background: #f1f5f9;
            border-radius: 10px;
        }

        .results-container::-webkit-scrollbar-thumb {
            background: #2563eb;
            border-radius: 10px;
        }

        .results-container::-webkit-scrollbar-thumb:hover {
            background: #1d4ed8;
        }
    </style>
</head>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script>
        let csvData = [];
        let headers = [];
        let pdfLinks = [
            'https://raw.githubusercontent.com/pkejajar/sanxing/main/pdf/akt%20kol%20sanxing%20hidayat.pdf',
            'https://raw.githubusercontent.com/mashidayat24/krn/main/pdf/KRN%20KEJAJAR.pdf'
        ];
        let currentResults = [];
        let pdfDoc = null;
        let pageNum = 1;
        let pageRendering = false;
        let pageNumPending = null;
        let scale = window.innerWidth < 768 ? 1.0 : 1.5;
        let currentPdfUrl = '';
        let pdfCache = {}; // Cache for loaded PDFs

        // Show cache indicator
        function showCacheIndicator(message) {
            const indicator = document.createElement('div');
            indicator.className = 'cache-indicator';
            indicator.textContent = message;
            document.body.appendChild(indicator);
            
            setTimeout(() => {
                indicator.style.opacity = '0';
                setTimeout(() => indicator.remove(), 300);
            }, 2000);
        }

        // Set PDF.js worker
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

        // Load CSV data
        async function loadCSV() {
            try {
                // Check if data exists in storage
                const storedData = await window.storage.get('csv-data');
                
                if (storedData && storedData.value) {
                    // Load from storage
                    const data = JSON.parse(storedData.value);
                    csvData = data.csvData;
                    headers = data.headers;
                    console.log('Data loaded from storage');
                    showCacheIndicator('⚡ Data dimuat dari cache');
                    return;
                }
                
                // If not in storage, fetch from URL
                const response = await fetch('https://raw.githubusercontent.com/telwbo/gantimeterwbo/refs/heads/main/vkrn_sanxing.csv');
                const text = await response.text();
                parseCSV(text);
                
                // Save to storage for future use
                await window.storage.set('csv-data', JSON.stringify({
                    csvData: csvData,
                    headers: headers
                }));
                console.log('Data saved to storage');
                showCacheIndicator('💾 Data tersimpan untuk akses cepat');
            } catch (error) {
                console.error('Error loading CSV:', error);
                // If storage fails, try to load from URL anyway
                try {
                    const response = await fetch('https://raw.githubusercontent.com/telwbo/gantimeterwbo/refs/heads/main/vkrn_sanxing.csv');
                    const text = await response.text();
                    parseCSV(text);
                } catch (fetchError) {
                    console.error('Error fetching CSV:', fetchError);
                }
            }
        }

        function parseCSV(text) {
            const lines = text.split('\n').filter(line => line.trim());
            if (lines.length > 0) {
                headers = lines[0].split(';').map(h => h.trim());
                
                for (let i = 1; i < lines.length; i++) {
                    const values = lines[i].split(';').map(v => v.trim());
                    const row = {};
                    headers.forEach((header, index) => {
                        row[header] = values[index] || '';
                    });
                    csvData.push(row);
                }
            }
        }

        function searchData() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase().trim();
            
            if (!searchTerm) {
                alert('Silakan masukkan kata kunci pencarian!');
                return;
            }

            // Filter data
            const results = csvData.filter(row => {
                return Object.values(row).some(value => 
                    value.toLowerCase().includes(searchTerm)
                );
            });

            displayResults(results);
        }

        function displayResults(results) {
            const searchPage = document.getElementById('searchPage');
            const resultsPage = document.getElementById('resultsPage');
            const resultsContainer = document.getElementById('resultsContainer');

            // Save current results
            currentResults = results;

            // Switch pages
            searchPage.style.display = 'none';
            resultsPage.style.display = 'block';

            // Display results
            if (results.length === 0) {
                resultsContainer.innerHTML = '<div class="no-results">Tidak ada hasil yang ditemukan.</div>';
                return;
            }

            let html = '';
            results.forEach((row, index) => {
                html += '<div class="result-item">';
                html += '<div class="result-table">';
                
                headers.forEach(header => {
                    if (row[header]) {
                        html += '<div class="result-row">';
                        html += `<div class="result-label">${header}:</div>`;
                        html += `<div class="result-value">${row[header]}</div>`;
                        html += '</div>';
                    }
                });
                
                html += '</div>';
                html += '</div>';
            });

            resultsContainer.innerHTML = html;
        }

        function goBack() {
            const searchPage = document.getElementById('searchPage');
            const resultsPage = document.getElementById('resultsPage');
            
            resultsPage.style.display = 'none';
            searchPage.style.display = 'block';
            
            // Reset search input
            document.getElementById('searchInput').value = '';
            document.getElementById('searchInput').focus();
        }

        async function viewPDF() {
            // Get idpel from first result
            let idpel = '';
            if (currentResults.length > 0) {
                const firstResult = currentResults[0];
                // Try to find idpel field (case insensitive)
                for (let key in firstResult) {
                    if (key.toLowerCase() === 'idpel') {
                        idpel = firstResult[key];
                        break;
                    }
                }
            }

            if (!idpel) {
                alert('ID Pelanggan tidak ditemukan dalam hasil pencarian.');
                return;
            }

            // Show loading message
            const resultsPage = document.getElementById('resultsPage');
            const pdfPage = document.getElementById('pdfPage');
            const pdfContainer = document.getElementById('pdfContainer');
            
            resultsPage.style.display = 'none';
            pdfPage.style.display = 'block';
            
            // Show loading in PDF container
            pdfContainer.innerHTML = '<div class="loading">Mencari "' + idpel + '" di semua PDF...</div>';

            try {
                let foundPage = null;
                let foundPdfUrl = null;
                
                // Search through all PDF files
                for (let pdfUrl of pdfLinks) {
                    // Check if PDF is already cached
                    let pdf;
                    if (pdfCache[pdfUrl]) {
                        pdf = pdfCache[pdfUrl];
                        console.log('Using cached PDF:', pdfUrl);
                        showCacheIndicator('⚡ PDF dimuat dari cache');
                    } else {
                        const loadingTask = pdfjsLib.getDocument(pdfUrl);
                        pdf = await loadingTask.promise;
                        pdfCache[pdfUrl] = pdf; // Cache the PDF
                        console.log('PDF cached:', pdfUrl);
                    }
                    
                    // Search through all pages in this PDF
                    for (let pageNumber = 1; pageNumber <= pdf.numPages; pageNumber++) {
                        const page = await pdf.getPage(pageNumber);
                        const textContent = await page.getTextContent();
                        const text = textContent.items.map(item => item.str).join(' ');
                        
                        // Check if idpel exists in this page
                        if (text.includes(idpel)) {
                            foundPage = pageNumber;
                            foundPdfUrl = pdfUrl;
                            pdfDoc = pdf;
                            break;
                        }
                    }
                    
                    // If found in this PDF, stop searching other PDFs
                    if (foundPage) {
                        currentPdfUrl = foundPdfUrl;
                        break;
                    }
                }

                if (foundPage) {
                    // Get PDF name from URL
                    const pdfName = foundPdfUrl.split('/').pop().replace(/%20/g, ' ');
                    
                    // Restore PDF viewer elements
                    pdfContainer.innerHTML = `
                        <div style="text-align: center; padding: 10px; background: #dbeafe; border-radius: 10px; margin-bottom: 10px; color: #1e40af; font-weight: 600;">
                            📄 ${pdfName}
                        </div>
                        <div id="pdfControls" style="text-align: center; padding: 15px; background: #f8fafc; border-radius: 10px; margin-bottom: 15px;">
                            <button class="btn" onclick="previousPage()" style="padding: 10px 20px; margin: 0 5px;">◄ Prev</button>
                            <span style="margin: 0 15px; font-weight: 600; color: #1e293b;">
                                Halaman: <span id="pageNum"></span> / <span id="pageCount"></span>
                            </span>
                            <button class="btn" onclick="nextPage()" style="padding: 10px 20px; margin: 0 5px;">Next ►</button>
                        </div>
                        <div style="text-align: center; overflow: auto;">
                            <canvas id="pdfCanvas" style="max-width: 100%; height: auto; border: 1px solid #e2e8f0; border-radius: 10px;"></canvas>
                        </div>
                    `;
                    
                    pageNum = foundPage;
                    document.getElementById('pageCount').textContent = pdfDoc.numPages;
                    renderPage(pageNum);
                } else {
                    pdfContainer.innerHTML = '<div class="no-results">ID Pelanggan "' + idpel + '" tidak ditemukan dalam semua PDF.</div>';
                }
            } catch (error) {
                console.error('Error loading PDF:', error);
                pdfContainer.innerHTML = '<div class="no-results">Gagal memuat PDF. Silakan coba lagi.</div>';
            }
        }

        function renderPage(num) {
            pageRendering = true;
            const canvas = document.getElementById('pdfCanvas');
            const ctx = canvas.getContext('2d');

            pdfDoc.getPage(num).then(function(page) {
                const viewport = page.getViewport({scale: scale});
                canvas.height = viewport.height;
                canvas.width = viewport.width;

                const renderContext = {
                    canvasContext: ctx,
                    viewport: viewport
                };

                const renderTask = page.render(renderContext);

                renderTask.promise.then(function() {
                    pageRendering = false;
                    if (pageNumPending !== null) {
                        renderPage(pageNumPending);
                        pageNumPending = null;
                    }
                });
            });

            document.getElementById('pageNum').textContent = num;
        }

        function queueRenderPage(num) {
            if (pageRendering) {
                pageNumPending = num;
            } else {
                renderPage(num);
            }
        }

        function previousPage() {
            if (pageNum <= 1) {
                return;
            }
            pageNum--;
            queueRenderPage(pageNum);
        }

        function nextPage() {
            if (pageNum >= pdfDoc.numPages) {
                return;
            }
            pageNum++;
            queueRenderPage(pageNum);
        }

        function backToResults() {
            const resultsPage = document.getElementById('resultsPage');
            const pdfPage = document.getElementById('pdfPage');
            
            pdfPage.style.display = 'none';
            resultsPage.style.display = 'block';
        }

        function openWhatsAppForm() {
            if (currentResults.length === 0) {
                alert('Tidak ada data hasil pencarian.');
                return;
            }

            // Use row 5 (index 4) if available, otherwise use first result
            const selectedResult = currentResults.length >= 5 ? currentResults[4] : currentResults[0];
            let idpel = '';
            let nama = '';
            let kelurahan = '';
            let kecamatan = '';

            // Find data from result
            for (let key in selectedResult) {
                const lowerKey = key.toLowerCase();
                if (lowerKey === 'idpel') {
                    idpel = selectedResult[key];
                } else if (lowerKey === 'nama' || lowerKey.includes('nama_pelanggan')) {
                    nama = selectedResult[key];
                } else if (lowerKey === 'nama_kelurahan' || lowerKey.includes('kelurahan')) {
                    kelurahan = selectedResult[key];
                } else if (lowerKey === 'nama_kecamatan' || lowerKey.includes('kecamatan')) {
                    kecamatan = selectedResult[key];
                }
            }

            // Populate form
            document.getElementById('waIdpel').value = idpel || '';
            document.getElementById('waNama').value = nama || '';
            document.getElementById('waKelurahan').value = kelurahan || '';
            document.getElementById('waKecamatan').value = kecamatan || '';
            document.getElementById('waLokasi').value = '';
            document.getElementById('waPhone').value = '';
            document.getElementById('photoBefore').value = '';
            document.getElementById('photoAfter').value = '';
            document.getElementById('previewBefore').innerHTML = '';
            document.getElementById('previewAfter').innerHTML = '';

            // Show WhatsApp form page
            document.getElementById('resultsPage').style.display = 'none';
            document.getElementById('waFormPage').style.display = 'block';
        }

        function getCurrentLocation() {
            const lokasiInput = document.getElementById('waLokasi');
            
            if (!navigator.geolocation) {
                alert('Geolocation tidak didukung di browser ini.');
                return;
            }

            lokasiInput.value = 'Mendapatkan lokasi...';

            navigator.geolocation.getCurrentPosition(
                function(position) {
                    const lat = position.coords.latitude.toFixed(6);
                    const lon = position.coords.longitude.toFixed(6);
                    const accuracy = position.coords.accuracy.toFixed(0);
                    
                    lokasiInput.value = `${lat}, ${lon} (±${accuracy}m)`;
                },
                function(error) {
                    let errorMsg = '';
                    switch(error.code) {
                        case error.PERMISSION_DENIED:
                            errorMsg = 'Izin lokasi ditolak';
                            break;
                        case error.POSITION_UNAVAILABLE:
                            errorMsg = 'Lokasi tidak tersedia';
                            break;
                        case error.TIMEOUT:
                            errorMsg = 'Timeout';
                            break;
                        default:
                            errorMsg = 'Error mendapatkan lokasi';
                    }
                    lokasiInput.value = errorMsg;
                    alert('Gagal mendapatkan lokasi: ' + errorMsg);
                },
                {
                    enableHighAccuracy: true,
                    timeout: 10000,
                    maximumAge: 0
                }
            );
        }

        function closeWhatsAppForm() {
            document.getElementById('waFormPage').style.display = 'none';
            document.getElementById('resultsPage').style.display = 'block';
        }

        function previewImage(input, previewId) {
            const preview = document.getElementById(previewId);
            preview.innerHTML = '';

            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    preview.innerHTML = `<img src="${e.target.result}" style="max-width: 100%; max-height: 200px; border-radius: 10px; border: 2px solid #e2e8f0; margin-top: 10px;">`;
                };
                reader.readAsDataURL(input.files[0]);
            }
        }

        async function sendToWhatsApp() {
            const idpel = document.getElementById('waIdpel').value;
            const nama = document.getElementById('waNama').value;
            const kelurahan = document.getElementById('waKelurahan').value;
            const kecamatan = document.getElementById('waKecamatan').value;
            const lokasi = document.getElementById('waLokasi').value.trim();
            const phone = document.getElementById('waPhone').value.trim();
            const photoBefore = document.getElementById('photoBefore').files[0];
            const photoAfter = document.getElementById('photoAfter').files[0];

            // Validation
            if (!lokasi) {
                alert('Silakan dapatkan lokasi perangkat terlebih dahulu!');
                return;
            }

            if (!photoBefore || !photoAfter) {
                alert('Silakan upload kedua foto (sebelum dan sesudah)!');
                return;
            }

            // Create Google Maps link from location
            let mapsLink = '';
            if (lokasi && lokasi.includes(',')) {
                const coords = lokasi.split(',');
                if (coords.length >= 2) {
                    const lat = coords[0].trim();
                    const lon = coords[1].split('(')[0].trim();
                    mapsLink = `https://maps.google.com/?q=${lat},${lon}`;
                }
            }

            // Create message
            let message = `*LAPORAN PEMASANGAN METER*

📋 *Data Pelanggan:*
ID Pelanggan: ${idpel}
Nama: ${nama}`;

            if (kelurahan) {
                message += `\nKelurahan: ${kelurahan}`;
            }
            if (kecamatan) {
                message += `\nKecamatan: ${kecamatan}`;
            }
            if (phone) {
                message += `\nNo. WA: ${phone}`;
            }

            message += `

📍 *Lokasi Pemasangan:*
${lokasi}`;

            if (mapsLink) {
                message += `\n${mapsLink}`;
            }

            message += `

📸 *Dokumentasi (2 Foto Terlampir):*
1️⃣ Foto tegangan KWh lama
2️⃣ Foto Set Max SESUDAH pemasangan`;

            // Prepare both photos for sharing together
            const files = [photoBefore, photoAfter];
            
            // Rename files for clarity
            const beforeFile = new File([photoBefore], `Sebelum_${idpel}.${photoBefore.name.split('.').pop()}`, { type: photoBefore.type });
            const afterFile = new File([photoAfter], `Sesudah_${idpel}.${photoAfter.name.split('.').pop()}`, { type: photoAfter.type });
            const renamedFiles = [beforeFile, afterFile];

            // Try using Web Share API with both files at once
            if (navigator.share && navigator.canShare) {
                try {
                    // Check if both files can be shared together
                    if (navigator.canShare({ files: renamedFiles })) {
                        await navigator.share({
                            title: 'Laporan Pemasangan Meter',
                            text: message,
                            files: renamedFiles  // Send both photos together
                        });
                        
                        showCacheIndicator('✅ Laporan + 2 foto berhasil dibagikan!');
                        return;
                    }
                } catch (error) {
                    if (error.name === 'AbortError') {
                        // User cancelled the share
                        return;
                    }
                    console.log('Web Share API error:', error);
                    // Continue to fallback
                }
            }

            // Fallback: Open WhatsApp without specific number
            const encodedMessage = encodeURIComponent(message);
            
            // Detect mobile device
            const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
            
            if (isMobile) {
                // Mobile: Try WhatsApp app intent first
                window.location.href = `whatsapp://send?text=${encodedMessage}`;
                
                // Fallback to web version if app doesn't open
                setTimeout(() => {
                    const opened = window.open(`https://api.whatsapp.com/send?text=${encodedMessage}`, '_blank');
                    if (!opened) {
                        alert('Silakan buka WhatsApp secara manual dan share laporan.');
                    }
                }, 1500);
            } else {
                // Desktop: Open WhatsApp Web
                window.open(`https://api.whatsapp.com/send?text=${encodedMessage}`, '_blank');
            }

            // Show instruction for manual photo attachment (both at once)
            setTimeout(() => {
                alert('WhatsApp telah dibuka!\n\n⚠️ PENTING - Lampirkan 2 foto BERSAMAAN:\n\n1. Pilih kontak tujuan\n2. Klik tombol lampiran (📎)\n3. Pilih KEDUA foto sekaligus:\n   • Foto "Sebelum_' + idpel + '"\n   • Foto "Sesudah_' + idpel + '"\n4. Kirim pesan dengan 2 foto\n\n💡 Tips: Tekan & tahan foto pertama, lalu tap foto kedua untuk memilih keduanya sekaligus.');
            }, 500);
        }

        // Handle Enter key
        document.getElementById('searchInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                searchData();
            }
        });

        // Load CSV on page load
        window.onload = function() {
            loadCSV();
        };
    </script>

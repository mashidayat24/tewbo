<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VKRN ULP Wonosobo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap');
        body { font-family: 'Poppins', sans-serif; }
        .golden-border { border: 4px solid; border-image-slice: 1; border-image-source: linear-gradient(to right, #333, #FFD700, #333); }
        .fab-spin:hover { transform: rotate(360deg); transition: transform 0.5s ease-in-out; }
        .fade-in { animation: fadeIn 0.5s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px);} to { opacity: 1; transform: translateY(0);}}
        ::-webkit-scrollbar { width: 8px;}
        ::-webkit-scrollbar-track { background: #f1f1f1;}
        ::-webkit-scrollbar-thumb { background: #2563eb; border-radius: 10px;}
        ::-webkit-scrollbar-thumb:hover { background: #1d4ed8;}
    </style>
</head>
<body class="bg-gray-100">

    <div id="loading-overlay" class="fixed inset-0 bg-black bg-opacity-70 flex-col items-center justify-center z-50 hidden">
        <div class="w-16 h-16 border-4 border-t-blue-500 border-gray-200 rounded-full animate-spin"></div>
        <p id="loading-text" class="text-white text-lg mt-4">Indexing data...</p>
    </div>

    <div id="toast-notification" class="fixed top-5 right-5 bg-green-500 text-white py-2 px-5 rounded-lg shadow-lg transform translate-x-[120%] transition-transform duration-500 z-40">
        <p id="toast-message">Aksi berhasil!</p>
    </div>

    <div class="container mx-auto max-w-lg p-4 min-h-screen bg-white shadow-2xl flex flex-col">
        <header class="text-center py-4 mb-4">
            <h1 class="text-3xl font-bold text-blue-700">VKRN ULP WONOSOBO</h1>
            <p class="text-gray-500">Sistem Verifikasi dan Pencarian Data Pelanggan</p>
            <div class="w-1/2 h-1 bg-gradient-to-r from-black via-yellow-400 to-black mx-auto mt-2 rounded"></div>
        </header>

        <main id="app-container">
            <div id="search-view">
                <div class="mb-4">
                    <label for="searchInput" class="block text-gray-700 text-sm font-bold mb-2">
                        Masukkan ID Pelanggan (IDPEL):
                    </label>
                    <input type="number" id="searchInput" class="golden-border shadow appearance-none w-full py-3 px-4 text-gray-700 leading-tight focus:outline-none focus:shadow-outline rounded-lg" placeholder="Contoh: 1234567890">
                </div>
                <button id="searchButton" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-lg focus:outline-none focus:shadow-outline transition duration-300">
                    <i class="fas fa-search mr-2"></i> Cari Data
                </button>
            </div>

            <div id="results-view" class="hidden fade-in">
                <div id="data-result-container" class="mb-4 p-4 border border-gray-200 rounded-lg bg-gray-50">
                    <h2 class="text-xl font-semibold mb-3 text-blue-800 border-b pb-2">Detail Data Pelanggan</h2>
                    <div id="data-result-content"></div>
                </div>
                <div id="pdf-result-container" class="mb-4 p-4 border border-gray-200 rounded-lg bg-gray-50">
                     <h2 class="text-xl font-semibold mb-3 text-blue-800 border-b pb-2">Dokumen Terkait (PDF)</h2>
                    <div id="pdf-result-content"></div>
                </div>
                <button id="kirimButton" class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-3 px-4 rounded-lg focus:outline-none focus:shadow-outline transition duration-300 mb-4">
                    <i class="fas fa-paper-plane mr-2"></i> Kirim Update Data
                </button>

                <div id="update-form-container" class="hidden fade-in p-4 border border-gray-200 rounded-lg bg-blue-50">
                     <h2 class="text-xl font-semibold mb-3 text-blue-800">Form Update</h2>
                    <div class="mb-3">
                        <label for="keteranganInput" class="block text-gray-700 text-sm font-bold mb-2">Keterangan:</label>
                        <textarea id="keteranganInput" rows="3" class="shadow appearance-none border rounded-lg w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline" placeholder="Masukkan keterangan"></textarea>
                    </div>
                    <div class="mb-3">
                        <label for="nomerHpInput" class="block text-gray-700 text-sm font-bold mb-2">Nomer HP Pelanggan:</label>
                        <input type="tel" id="nomerHpInput" class="shadow appearance-none border rounded-lg w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline" placeholder="Masukkan nomor HP">
                    </div>
                    <div class="mb-3">
                        <label for="lokasiInput" class="block text-gray-700 text-sm font-bold mb-2">Lokasi:</label>
                        <div class="flex items-center">
                            <input type="text" id="lokasiInput" class="shadow appearance-none border rounded-l-lg w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline" placeholder="Latitude, Longitude">
                            <button id="getLocationButton" class="bg-blue-500 hover:bg-blue-600 text-white font-bold p-2 rounded-r-lg">
                                <i class="fas fa-map-marker-alt"></i>
                            </button>
                        </div>
                    </div>
                    <button id="updateButton" class="w-full bg-purple-600 hover:bg-purple-700 text-white font-bold py-3 px-4 rounded-lg focus:outline-none focus:shadow-outline transition duration-300">
                        <i class="fas fa-sync-alt mr-2"></i> Update Data
                    </button>
                </div>
                <button id="searchAgainButton" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-lg focus:outline-none focus:shadow-outline transition duration-300 mt-3">
                    <i class="fas fa-undo mr-2"></i> Cari Lagi
                </button>
            </div>
        </main>
        
        <footer class="text-center text-gray-500 text-sm py-4 mt-auto">
            <p>&copy;TELWBO 2025</p>
        </footer>
    </div>
    <button id="refreshButton" class="fab-spin fixed bottom-6 right-6 bg-blue-600 hover:bg-blue-800 text-white w-16 h-16 rounded-full shadow-lg flex items-center justify-center text-2xl transition-all z-50">
        <i class="fas fa-sync"></i>
    </button>

    <script>
    // Simulasi database hanya untuk update sementara (update form)
    // let updatedDataCache = {}; // key: idpel -- SUDAH TIDAK DIPAKAI

    // DOM ELEMENTS
    const searchView = document.getElementById('search-view');
    const resultsView = document.getElementById('results-view');
    const searchInput = document.getElementById('searchInput');
    const searchButton = document.getElementById('searchButton');
    const dataResultContent = document.getElementById('data-result-content');
    const pdfResultContent = document.getElementById('pdf-result-content');
    const kirimButton = document.getElementById('kirimButton');
    const updateFormContainer = document.getElementById('update-form-container');
    const keteranganInput = document.getElementById('keteranganInput');
    const nomerHpInput = document.getElementById('nomerHpInput');
    const lokasiInput = document.getElementById('lokasiInput');
    const getLocationButton = document.getElementById('getLocationButton');
    const updateButton = document.getElementById('updateButton');
    const refreshButton = document.getElementById('refreshButton');
    const loadingOverlay = document.getElementById('loading-overlay');
    const loadingText = document.getElementById('loading-text');
    const searchAgainButton = document.getElementById('searchAgainButton');

    let currentRecord = null;

    // Utility: Show toast notification
    function showToast(message, type = 'success') {
        const toast = document.getElementById('toast-notification');
        const toastMessage = document.getElementById('toast-message');
        toastMessage.textContent = message;
        toast.className = toast.className.replace(/bg-(green|red)-500/, `bg-${type === 'success' ? 'green' : 'red'}-500`);
        toast.style.transform = 'translateX(0)';
        setTimeout(() => {
            toast.style.transform = 'translateX(120%)';
        }, 3000);
    }

    // --- CSV DATA FETCH ---
    // Expected CSV header: idpel,nama,alamat,tarif,keterangan,nomer_hp,lokasi
    async function fetchCustomerData(idpel) {
        try {
            const response = await fetch('data/data.csv');
            if (!response.ok) throw new Error('CSV tidak ditemukan');
            const csvText = await response.text();
            const rows = csvText.trim().split('\n');
            if (rows.length < 2) return null;
            const headers = rows[0].split(',');
            for (let i = 1; i < rows.length; i++) {
                const cols = rows[i].split(',');
                if (cols[0] === idpel) {
                    let record = {};
                    headers.forEach((h, idx) => { record[h.trim()] = (cols[idx] || '').trim(); });
                    return record;
                }
            }
            return null;
        } catch (err) {
            showToast('Data pelanggan gagal diakses (CSV tidak ditemukan)', 'error');
            return null;
        }
    }

    // --- PDF CHECK ---
    async function checkPDFExists(idpel) {
        const pdfPath = `pdf/${idpel}.pdf`;
        try {
            const res = await fetch(pdfPath, { method: 'HEAD' });
            return res.ok ? pdfPath : null;
        } catch (err) {
            return null;
        }
    }

    // --- HANDLE SEARCH ---
    async function handleSearch() {
        const query = searchInput.value;
        if (!query) {
            showToast('IDPEL tidak boleh kosong!', 'error');
            return;
        }
        loadingText.textContent = 'Mencari data pelanggan...';
        loadingOverlay.classList.remove('hidden');
        loadingOverlay.classList.add('flex');

        currentRecord = await fetchCustomerData(query);

        loadingOverlay.classList.add('hidden');
        loadingOverlay.classList.remove('flex');

        if (currentRecord) {
            displayResults(currentRecord);
            searchView.classList.add('hidden');
            resultsView.classList.remove('hidden');
            refreshButton.classList.add('hidden');
        } else {
            showToast('Data pelanggan tidak ditemukan!', 'error');
        }
    }

    // --- DISPLAY RESULTS ---
    async function displayResults(record) {
        dataResultContent.innerHTML = `
            <div class="grid grid-cols-3 gap-2 text-sm">
                <strong class="col-span-1">IDPEL</strong><span class="col-span-2">: ${record.idpel || '-'}</span>
                <strong class="col-span-1">Nama</strong><span class="col-span-2">: ${record.nama || '-'}</span>
                <strong class="col-span-1">Alamat</strong><span class="col-span-2">: ${record.alamat || '-'}</span>
                <strong class="col-span-1">Tarif</strong><span class="col-span-2">: ${record.tarif || '-'}</span>
                <strong class="col-span-1">Keterangan</strong><span class="col-span-2">: ${record.keterangan || '-'}</span>
                <strong class="col-span-1">No. HP</strong><span class="col-span-2">: ${record.nomer_hp || '-'}</span>
                <strong class="col-span-1">Lokasi</strong><span class="col-span-2">: ${record.lokasi || '-'}</span>
            </div>
        `;
        // Check PDF
        const pdfPath = await checkPDFExists(record.idpel);
        if (pdfPath) {
            pdfResultContent.innerHTML = `
                <div class="bg-green-100 border-l-4 border-green-500 text-green-700 p-3 rounded">
                    <p class="font-bold">File PDF Ditemukan!</p>
                    <a href="${pdfPath}" target="_blank" class="underline text-blue-700">Lihat PDF</a>
                    <p class="text-xs text-gray-600 mt-1">File diambil dari folder <b>pdf/</b>.</p>
                </div>
            `;
        } else {
            pdfResultContent.innerHTML = `
                <div class="bg-red-100 border-l-4 border-red-500 text-red-700 p-3 rounded">
                    <p class="font-bold">File PDF tidak ditemukan.</p>
                    <p class="text-xs">Pastikan file PDF tersedia di folder <b>pdf/</b> dengan nama <b>${record.idpel}.pdf</b></p>
                </div>
            `;
        }
    }

    // --- RESET TO SEARCH VIEW ---
    function resetToSearchView() {
        resultsView.classList.add('hidden');
        searchView.classList.remove('hidden');
        refreshButton.classList.remove('hidden');
        searchInput.value = '';
        currentRecord = null;
        updateFormContainer.classList.add('hidden');
        kirimButton.classList.remove('hidden');
        keteranganInput.value = '';
        nomerHpInput.value = '';
        lokasiInput.value = '';
    }

    // --- SHOW UPDATE FORM ---
    function showUpdateForm() {
        if (!currentRecord) return;
        keteranganInput.value = currentRecord.keterangan || '';
        nomerHpInput.value = currentRecord.nomer_hp || '';
        lokasiInput.value = currentRecord.lokasi || '';
        updateFormContainer.classList.remove('hidden');
        kirimButton.classList.add('hidden');
    }

    // --- GET LOCATION ---
    function handleGetLocation() {
        if (!navigator.geolocation) {
            showToast('Browser Anda tidak mendukung Geolocation!', 'error');
            return;
        }
        function success(position) {
            const latitude = position.coords.latitude;
            const longitude = position.coords.longitude;
            lokasiInput.value = `${latitude.toFixed(5)}, ${longitude.toFixed(5)}`;
            showToast('Lokasi berhasil didapatkan!');
        }
        function error() {
            showToast('Gagal mendapatkan lokasi. Pastikan izin lokasi diberikan.', 'error');
        }
        navigator.geolocation.getCurrentPosition(success, error);
    }

    // --- HANDLE UPDATE (update ke server) ---
    function handleUpdate() {
        if (!currentRecord) return;
        loadingText.textContent = 'Menyimpan data...';
        loadingOverlay.classList.remove('hidden');
        loadingOverlay.classList.add('flex');
        // Kirim ke backend
        fetch('http://localhost:3000/api/update-csv', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({
                idpel: currentRecord.idpel,
                keterangan: keteranganInput.value,
                nomer_hp: nomerHpInput.value,
                lokasi: lokasiInput.value
            })
        })
        .then(res => res.json())
        .then(data => {
            loadingOverlay.classList.add('hidden');
            loadingOverlay.classList.remove('flex');
            if (data.message === 'Update berhasil') {
                showToast('Data berhasil diupdate!');
                fetchCustomerData(currentRecord.idpel).then(updatedRecord => {
                    displayResults(updatedRecord);
                });
                updateFormContainer.classList.add('hidden');
                kirimButton.classList.remove('hidden');
            } else {
                showToast(data.message || 'Gagal update!', 'error');
            }
        })
        .catch(() => {
            loadingOverlay.classList.add('hidden');
            loadingOverlay.classList.remove('flex');
            showToast('Gagal update data!', 'error');
        });
    }

    // --- INDEXING BUTTON (hanya notifikasi) ---
    function handleIndexing() {
        loadingText.textContent = 'Indexing data...';
        loadingOverlay.classList.remove('hidden');
        loadingOverlay.classList.add('flex');
        setTimeout(() => {
            loadingOverlay.classList.add('hidden');
            loadingOverlay.classList.remove('flex');
            showToast('Indexing data berhasil diselesaikan!');
        }, 1500);
    }

    // --- EVENT LISTENERS ---
    refreshButton.addEventListener('click', handleIndexing);
    searchButton.addEventListener('click', handleSearch);
    kirimButton.addEventListener('click', showUpdateForm);
    getLocationButton.addEventListener('click', handleGetLocation);
    updateButton.addEventListener('click', handleUpdate);
    searchAgainButton.addEventListener('click', resetToSearchView);
    searchInput.addEventListener('keyup', function(event) {
        if (event.key === 'Enter') handleSearch();
    });
    window.onload = () => { handleIndexing(); };
    </script>
</body>
                        </html>
